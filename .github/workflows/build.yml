# 두들 데이 버디 — 클라우드 자동 빌드 (Mac + Windows + Windows 7)
# 사용법: 이 저장소를 GitHub에 올리면 자동 실행됩니다.
#         수동 실행: 저장소 → Actions 탭 → "Build installers" → Run workflow

name: Build installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 버튼으로 수동 실행 가능

jobs:
  # ── 1) Mac 설치본 (.dmg) ─────────────────────────────
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          rm -rf electron-app/dist
          cp -R dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Mac 빌드
        working-directory: electron-app
        run: npx electron-builder --mac --publish never
      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: DoodleDayBuddy-Mac
          path: electron-app/release/*.dmg

  # ── 2) Windows 10/11 설치본 (.exe) ───────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          if (Test-Path electron-app/dist) { Remove-Item -Recurse -Force electron-app/dist }
          Copy-Item -Recurse dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Windows 빌드
        working-directory: electron-app
        run: npx electron-builder --win --publish never
      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: DoodleDayBuddy-Windows
          path: electron-app/release/*.exe

  # ── 3) Windows 7 전용 설치본 (Electron 22) ───────────
  windows7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          if (Test-Path electron-app/dist) { Remove-Item -Recurse -Force electron-app/dist }
          Copy-Item -Recurse dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Windows 7 호환 Electron(22)으로 교체
        working-directory: electron-app
        run: npm install --save-dev electron@22.3.27
      - name: Windows 7 빌드 (32비트 = 32·64비트 윈7 모두 실행)
        working-directory: electron-app
        run: npx electron-builder --win nsis --ia32 --publish never
      - name: 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: DoodleDayBuddy-Windows7
          path: electron-app/release/*.exe

  # ── 4) 설치파일을 Release 에 자동 게시 ────────────────
  #  · 위 3개 빌드가 끝나면 결과물을 모아 하나의 Release 로 공개합니다.
  #  · 버전은 electron-app/package.json 의 version 을 태그로 사용 (예: v0.96.1)
  #  · 다운로드 주소로는 https://github.com/<아이디>/<저장소>/releases/latest 를
  #    app_meta.download_url 에 넣으면, 사용자가 자기 OS 파일을 골라 받습니다.
  release:
    needs: [ mac, windows, windows7 ]
    if: ${{ always() }}          # 일부 OS 빌드가 실패해도 성공한 것만 게시
    runs-on: ubuntu-latest
    permissions:
      contents: write            # Release 생성 권한
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: ver
        run: echo "v=$(node -p "require('./electron-app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 빌드 결과물 모두 내려받기
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release 만들기/갱신
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: MomentPlan v${{ steps.ver.outputs.v }}
          body: |
            MomentPlan 설치파일입니다. 자기 OS에 맞는 파일을 받으세요.
            · Windows(윈7·10·11 공용): MomentPlan-Setup-...-ia32.exe
            · Windows 10/11 전용: MomentPlan-Setup-...-x64.exe
            · Mac: MomentPlan-...-universal.dmg
          files: artifacts/**/*
          fail_on_unmatched_files: false
