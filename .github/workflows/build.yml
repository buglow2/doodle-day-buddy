# 두들 데이 버디 — 클라우드 자동 빌드 (Mac + Windows + Windows 7)
# 사용법: 이 저장소를 GitHub에 올리면 자동 실행됩니다.
#         수동 실행: 저장소 → Actions 탭 → "Build installers" → Run workflow
#
# ※ 설치파일을 "임시 창고(아티팩트)"에 올렸다 내리지 않고,
#    만들자마자 곧바로 Release(다운로드 페이지)에 붙입니다.
#    → 아티팩트 저장공간(quota) 부족 문제가 원천적으로 사라집니다.

name: Build installers

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 버튼으로 수동 실행 가능

permissions:
  contents: write       # Release 생성/첨부 권한

jobs:
  # ── 0) Release 껍데기 먼저 만들기 (버전 태그) ─────────
  #  · 버전은 electron-app/package.json 의 version 을 태그로 사용 (예: v0.97.88)
  #  · 여기서 미리 만들어 두면, 빌드 3개가 동시에 파일을 붙여도 충돌이 없습니다.
  mkrelease:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: ver
        run: echo "tag=v$(node -p "require('./electron-app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 릴리스 준비 (없으면 생성)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MomentPlan ${{ steps.ver.outputs.tag }}
          body: |
            MomentPlan 설치파일입니다. 자기 OS에 맞는 파일을 받으세요.
            · Windows 7 : MomentPlan-Setup_win7-버전.exe
            · Windows 10 / 11 : MomentPlan-Setup_win10-11-버전.exe
            · Mac : MomentPlan-Setup_mac-버전.dmg

  # ── 0.5) 업데이트 알림용: Supabase app_meta 버전 자동 갱신 ─────
  #  · 릴리스가 만들어지면 앱 안 "새 버전" 알림이 이 값을 보고 뜹니다.
  #  · 저장소가 private여도 GitHub API 없이 알림이 뜨게 해줍니다.
  #  · 필요 시크릿(저장소 → Settings → Secrets and variables → Actions):
  #      SUPABASE_URL          예) https://xxxx.supabase.co
  #      SUPABASE_SERVICE_KEY  Supabase → Settings → API → service_role 키
  #    (service_role 키는 GitHub 비밀값에만 두고, 앱(클라이언트)엔 절대 넣지 않습니다)
  bumpmeta:
    needs: mkrelease
    runs-on: ubuntu-latest
    steps:
      - name: Supabase app_meta.latest_version 갱신
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TAG: ${{ needs.mkrelease.outputs.tag }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_KEY 시크릿이 없어 건너뜁니다. (설정하면 자동 갱신됩니다)"
            exit 0
          fi
          VER="${TAG#v}"
          echo "app_meta.latest_version -> $VER"
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/app_meta" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            -d "[{\"id\":1,\"latest_version\":\"$VER\"}]")
          echo "HTTP $code"; cat /tmp/resp.txt
          if [ "$code" -ge 300 ]; then echo "::error::app_meta 갱신 실패 (HTTP $code)"; exit 1; fi
          echo "✅ 업데이트 알림 버전이 $VER 로 갱신되었습니다."

  # ── 1) Mac 설치본 (.dmg) ─────────────────────────────
  mac:
    needs: mkrelease
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          rm -rf electron-app/dist
          cp -R dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Mac 빌드
        working-directory: electron-app
        run: npx electron-builder --mac --publish never
      - name: 파일명 정리 (mac)
        working-directory: electron-app/release
        run: |
          v="${{ needs.mkrelease.outputs.tag }}"; v="${v#v}"
          f=$(ls *.dmg | head -1)
          mv "$f" "MomentPlan-Setup_mac-$v.dmg"
      - name: 릴리스에 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.mkrelease.outputs.tag }}
          files: electron-app/release/MomentPlan-Setup_mac-*.dmg
          fail_on_unmatched_files: false

  # ── 2) Windows 10/11 설치본 (.exe) ───────────────────
  windows:
    needs: mkrelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          if (Test-Path electron-app/dist) { Remove-Item -Recurse -Force electron-app/dist }
          Copy-Item -Recurse dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Windows 빌드
        working-directory: electron-app
        run: npx electron-builder --win --publish never
      - name: 파일명 정리 (win10/11)
        working-directory: electron-app/release
        shell: pwsh
        run: |
          $v = "${{ needs.mkrelease.outputs.tag }}".TrimStart('v')
          Get-ChildItem -Filter *.exe | Select-Object -First 1 | Rename-Item -NewName "MomentPlan-Setup_win10-11-$v.exe"
      - name: 릴리스에 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.mkrelease.outputs.tag }}
          files: electron-app/release/MomentPlan-Setup_win10-11-*.exe
          fail_on_unmatched_files: false

  # ── 3) Windows 7 전용 설치본 (Electron 22) ───────────
  windows7:
    needs: mkrelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 앱 파일 복사
        run: |
          if (Test-Path electron-app/dist) { Remove-Item -Recurse -Force electron-app/dist }
          Copy-Item -Recurse dist electron-app/dist
      - name: 의존성 설치
        working-directory: electron-app
        run: npm install --no-audit --no-fund
      - name: Windows 7 호환 Electron(22)으로 교체
        working-directory: electron-app
        run: npm install --save-dev electron@22.3.27
      - name: Windows 7 빌드 (32비트 = 32·64비트 윈7 모두 실행)
        working-directory: electron-app
        run: npx electron-builder --win nsis --ia32 --publish never
      - name: 파일명 정리 (win7)
        working-directory: electron-app/release
        shell: pwsh
        run: |
          $v = "${{ needs.mkrelease.outputs.tag }}".TrimStart('v')
          Get-ChildItem -Filter *.exe | Select-Object -First 1 | Rename-Item -NewName "MomentPlan-Setup_win7-$v.exe"
      - name: 릴리스에 첨부
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.mkrelease.outputs.tag }}
          files: electron-app/release/MomentPlan-Setup_win7-*.exe
          fail_on_unmatched_files: false
